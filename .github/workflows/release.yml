name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer candidate used by a dry-run
        required: true
        default: "0.1.3"
        type: string
      dry-run:
        description: Build and verify without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check lockstep package metadata
        run: python scripts/release_check.py --version "${{ steps.version.outputs.value }}"

  build-python:
    name: build Python distribution
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --directory python --all-extras --dev
      - run: uv run --directory python pytest
      - run: uv build --directory python
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error

  build-typescript:
    name: build TypeScript distribution
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: typescript
      - run: pnpm lint && pnpm format:check && pnpm typecheck && pnpm test
        working-directory: typescript
      - run: pnpm build
        working-directory: typescript
      - run: pnpm pack --pack-destination release-dist
        working-directory: typescript
      - uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: typescript/release-dist/*.tgz
          if-no-files-found: error

  publish-python:
    name: publish Python to PyPI
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    needs: build-python
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-npm:
    name: publish TypeScript to npm
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
    needs: build-typescript
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: release-dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish with npm provenance
        run: npm publish release-dist/*.tgz --provenance --access public
