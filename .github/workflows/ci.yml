# CI for capsize-commons (CAPSIZE_PROJECT_STANDARDS.md §10).
#
# Per-language stages call the versioned reusable workflows owned by capsize-ci.
# Pin the authority to an immutable commit; the rules-sync and manifest jobs
# remain repository-local because they validate this repository's own contract.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    uses: Capsize-Games/capsize-ci/.github/workflows/python-ci.yml@1a50d06c20022f9bbc44bad002add302e1dae646
    with:
      working-directory: python
      lint-paths: . ../scripts
      mypy-path: src

  typescript:
    uses: Capsize-Games/capsize-ci/.github/workflows/node-ci.yml@1a50d06c20022f9bbc44bad002add302e1dae646
    with:
      working-directory: typescript
      node-version: "22"
      pnpm-version: "12.4.2"

  cpp:
    uses: Capsize-Games/capsize-ci/.github/workflows/cpp-ci.yml@1a50d06c20022f9bbc44bad002add302e1dae646
    with:
      working-directory: cpp

  rules-sync:
    name: rules-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on drift in derived instruction files
        run: bash scripts/sync-rules.sh --check

  manifest:
    name: validate capsize.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest against the published schema
        run: |
          python -m pip install --quiet check-jsonschema
          check-jsonschema --schemafile \
            https://raw.githubusercontent.com/Capsize-Games/capsize-ci/1a50d06c20022f9bbc44bad002add302e1dae646/schema/capsize-1.json \
            capsize.json
